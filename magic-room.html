<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Another room</title>
    <link rel="stylesheet" href="styles/style.css?v=20261107">
    <script src="script/magic-cursor.js" defer></script>
    <script src="script/magic-room.js" defer></script>
</head>
<body class="magic-room">
    <div class="magic-wall" id="magic-wall" aria-label="Guestbook names"></div>
    <main class="magic-center">
        <button class="magic-ball" id="magic-ball" type="button" aria-label="Change your mouse pointer" disabled>
            <img src="magic_ball.gif" alt="" width="22" height="27">
        </button>
        <p class="secret-screen-reader" id="magic-status" role="status">Click the magic ball to change your pointer.</p>
        <a class="magic-return" href="secret-room.html" aria-label="Return to the previous room">
            <img src="secret_return.gif" alt="" width="39" height="46">
        </a>
        <noscript><p>The magic ball needs JavaScript.</p></noscript>
    </main>
</body>
</html>
