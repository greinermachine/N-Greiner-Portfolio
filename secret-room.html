<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>A room</title>
    <link rel="stylesheet" href="styles/style.css?v=20261107">
    <script src="script/magic-cursor.js" defer></script>
    <script src="script/secret-room.js" defer></script>
</head>
<body class="secret-room">
    <main class="secret-room-center">
        <button class="secret-switch" id="secret-switch" type="button" aria-label="Turn the lights off" aria-pressed="true" disabled>
            <img src="light_switch.gif" alt="" width="30" height="39">
        </button>
        <p class="secret-screen-reader" id="secret-light-status" role="status">The lights are on.</p>
        <noscript><p>This switch needs JavaScript.</p></noscript>
    </main>
    <a class="secret-unlocked-door" id="secret-unlocked-door" href="magic-room.html" aria-label="Enter the unlocked door" hidden>
        <img src="door_unlocked.gif" alt="" width="32" height="32">
    </a>
    <a class="secret-room-return" id="secret-room-return" href="index.html" aria-label="Return to the website">
        <img src="secret_return.gif" alt="" width="39" height="46">
    </a>
</body>
</html>
